; ---- Development-oriented PHP settings -------------------------------
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /dev/stderr

memory_limit = 512M
max_execution_time = 120

; Image / resource uploads (blog + project galleries)
upload_max_filesize = 32M
post_max_size = 32M
max_file_uploads = 40

date.timezone = Africa/Johannesburg

; Mail is captured by Mailpit; the app uses SMTP via PHPMailer,
; but this covers any bare mail() call.
sendmail_path = "/usr/sbin/sendmail -S mailpit:1025"

; OPcache: revalidate every request so edits show up immediately.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

session.cookie_httponly = 1
session.use_strict_mode = 1
