<VirtualHost *:80>
    ServerName localhost

    # DocumentRoot is public/ — matches a correct production layout and means
    # the app is served from the site root (APP_BASE_URL="").
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Application code must never be reachable over HTTP.
    <Directory /var/www/html/app>
        Require all denied
    </Directory>
    <Directory /var/www/html/tools>
        Require all denied
    </Directory>
    <Directory /var/www/html/vendor>
        Require all denied
    </Directory>
    <Directory /var/www/html/database>
        Require all denied
    </Directory>

    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
